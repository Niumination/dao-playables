<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATHER 聚 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: #0b0a0c; color: #ddd5d0; overflow: hidden; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 14px; left: 16px; font-size: 12px; color: #a89c94; line-height: 1.7; pointer-events: none; }
    #hud b { color: #f0e8e0; letter-spacing: 0.05em; }
    #hud .zh { color: #c99a7a; }
    #panel {
      position: fixed; top: 14px; right: 16px; width: 230px; background: rgba(14, 12, 12, 0.74);
      border: 1px solid rgba(201, 154, 122, 0.28); border-radius: 10px; padding: 12px 14px; font-size: 12px;
      backdrop-filter: blur(6px);
    }
    #panel h2 { font-size: 11px; color: #c99a7a; letter-spacing: 0.12em; margin-bottom: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: #b8ab9f; }
    #panel input[type=range] { width: 100%; accent-color: #c99a7a; }
    #panel .val { color: #f0e8e0; }
    #panel button { all: unset; cursor: pointer; margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(201, 154, 122, 0.4); color: #c99a7a; font-size: 11px; text-align: center; display: block; }
    #panel button:hover { background: rgba(201, 154, 122, 0.12); }
    footer { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #665c54; pointer-events: none; }
    footer a { color: #c99a7a; text-decoration: none; }
    @media (max-width: 640px) { #panel { width: 180px; font-size: 11px; } }
  </style>
  <script type="module" crossorigin src="/gather/assets/index-Cdl6XxP2.js"></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <b>GATHER</b> <span class="zh">聚</span><br />
    <span id="stat">—</span>
  </div>
  <div id="panel">
    <h2>PARAMETER</h2>
    <label>tarikan gravitasi <span class="val" id="g-v">220</span></label>
    <input id="grav" type="range" min="40" max="600" step="5" value="220" />
    <label>pengereman <span class="val" id="d-v">0.92</span></label>
    <input id="damp" type="range" min="0.8" max="0.995" step="0.005" value="0.92" />
    <label>partikel <span class="val" id="n-v">900</span></label>
    <input id="count" type="range" min="100" max="3000" step="50" value="900" />
    <label>radius inti <span class="val" id="r-v">90</span></label>
    <input id="rad" type="range" min="20" max="240" step="5" value="90" />
    <button id="reset">↻ reset partikel</button>
  </div>
  <footer>
    Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>.
    Bukan salinan: kode & desain ditulis dari nol. © 2026 Niumination.
  </footer>
</body>
</html>

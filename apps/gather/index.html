<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GATHER 聚 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: #0b0a0c; color: #ddd5d0; overflow: hidden; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 14px; left: 16px; font-size: 12px; color: #a89c94; line-height: 1.7; pointer-events: none; }
    #hud b { color: #f0e8e0; letter-spacing: 0.05em; }
    #hud .zh { color: #c99a7a; }
    #panel { position: fixed; top: 14px; right: 16px; width: 230px; background: rgba(14,12,12,0.74); border: 1px solid rgba(201,154,122,0.28); border-radius: 10px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(6px); }
    #panel h2 { font-size: 11px; color: #c99a7a; letter-spacing: 0.12em; margin-bottom: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: #b8ab9f; }
    #panel input[type=range] { width: 100%; accent-color: #c99a7a; }
    #panel .val { color: #f0e8e0; }
    #panel button, #panel label.file { all: unset; cursor: pointer; margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(201,154,122,0.4); color: #c99a7a; font-size: 11px; text-align: center; display: block; }
    #panel button:hover, #panel label.file:hover { background: rgba(201,154,122,0.12); }
    #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; border: 2px dashed rgba(201,154,122,0.6); background: rgba(11,10,12,0.6); font-size: 14px; color: #c99a7a; z-index: 9; }
    #drop.over { display: flex; }
    footer { position: fixed; bottom: 12px; left: 16px; font-size: 11px; color: #5f5550; }
    footer a { color: #c99a7a; text-decoration: none; }
    @media (max-width: 640px) { #panel { width: 180px; padding: 10px; font-size: 11px; } #hud { font-size: 11px; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>GATHER 聚</b><br /><span id="stat">—</span><br /><span id="sample" class="zh">—</span></div>
  <div id="panel">
    <h2>PANEL</h2>
    <label class="file">⬆ unggah gambar<input id="file" type="file" accept="image/*" hidden /></label>
    <label>energi <span class="val" id="e-v">0.50</span></label>
    <input id="energy" type="range" min="0" max="1" step="0.01" value="0.5" />
    <label>spin <span class="val" id="s-v">0.40</span></label>
    <input id="spin" type="range" min="0" max="1.5" step="0.02" value="0.4" />
    <button id="reset">↻ contoh ulang</button>
  </div>
  <div id="drop">LEPAS UNTUK JADI POINT CLOUD</div>
  <footer>Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>. © 2026 Niumination.</footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIRCUIT 電 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #0b0f10; color: #cfe3d6; min-height: 100vh;
      font-family: 'SF Mono', ui-monospace, Menlo, monospace;
      display: grid; grid-template-columns: 1fr 240px; grid-template-rows: 1fr;
    }
    #main { padding: 28px 36px; display: flex; flex-direction: column; gap: 14px; max-width: 900px; }
    h1 { font-size: 22px; color: #e6f2ea; letter-spacing: 0.06em; }
    h1 span { color: #7ee0a8; margin-right: 10px; }
    #stat { font-size: 12px; color: #f0c46a; }
    #scope { width: 100%; height: 320px; border: 1px solid rgba(120,180,150,0.2); border-radius: 8px; }
    #keys { display: flex; gap: 4px; flex-wrap: wrap; }
    .key { all: unset; cursor: pointer; width: 32px; height: 32px; border-radius: 6px; border: 1px solid rgba(126,224,168,0.35); color: #7ee0a8; font-size: 12px; text-align: center; line-height: 32px; background: rgba(10,14,12,0.6); }
    .key:hover { background: rgba(126,224,168,0.15); }
    .key.hit { background: #7ee0a8; color: #08120c; }
    #panel { border-left: 1px solid rgba(120,180,150,0.15); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    #panel h2 { font-size: 12px; color: #9db8a8; font-weight: normal; letter-spacing: 0.1em; }
    .slot { display: flex; flex-direction: column; gap: 6px; padding: 8px; border: 1px solid rgba(120,180,150,0.12); border-radius: 8px; }
    .slot b { font-size: 11px; color: #9db8a8; font-weight: normal; }
    .chips { display: flex; gap: 4px; }
    .chip { all: unset; cursor: pointer; width: 28px; height: 26px; border-radius: 5px; border: 1px solid rgba(120,180,150,0.2); color: #9db8a8; font-size: 11px; text-align: center; line-height: 26px; }
    .chip.on { background: rgba(126,224,168,0.15); color: #7ee0a8; border-color: rgba(126,224,168,0.5); }
    .val { font-size: 12px; color: #f0c46a; cursor: ew-resize; user-select: none; text-align: center; padding: 2px; border-radius: 4px; }
    .val:hover { background: rgba(240,196,106,0.1); }
    footer { font-size: 11px; color: #5f7268; margin-top: auto; }
    footer a { color: #7ee0a8; text-decoration: none; }
    @media (max-width: 720px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      #panel { border-left: none; border-top: 1px solid rgba(120,180,150,0.15); }
    }
  </style>
</head>
<body>
  <div id="main">
    <h1><span>電</span> CIRCUIT</h1>
    <span id="stat">—</span>
    <canvas id="scope"></canvas>
    <div id="keys"></div>
    <footer>
      Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>.
      Bukan salinan: kode & desain ditulis dari nol. © 2026 Niumination.
    </footer>
  </div>
  <div id="panel">
    <h2>SLOT KOMPONEN</h2>
    <div id="slots"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

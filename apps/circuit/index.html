<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIRCUIT 電 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #0b0f10; color: #cfe3d6; min-height: 100vh;
      font-family: 'SF Mono', ui-monospace, Menlo, monospace;
      display: grid; grid-template-columns: 1fr 250px; grid-template-rows: 1fr;
    }
    #main { padding: 20px 26px; display: flex; flex-direction: column; gap: 10px; }
    h1 { font-size: 18px; color: #e6f2ea; letter-spacing: 0.06em; }
    h1 span { color: #7ee0a8; margin-right: 8px; }
    #stat { font-size: 12px; color: #f0c46a; }
    #board { width: 100%; flex: 1; min-height: 340px; border: 1px solid rgba(120,180,150,0.2); border-radius: 8px; cursor: crosshair; }
    #keys { display: flex; gap: 4px; flex-wrap: wrap; }
    .key { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(126,224,168,0.35); color: #7ee0a8; font-size: 11px; text-align: center; line-height: 30px; background: rgba(10,14,12,0.6); }
    .key:hover { background: rgba(126,224,168,0.15); }
    .key.hit { background: #7ee0a8; color: #08120c; }
    #panel { border-left: 1px solid rgba(120,180,150,0.15); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    #panel h2 { font-size: 11px; color: #9db8a8; font-weight: normal; letter-spacing: 0.1em; }
    .chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .chip { all: unset; cursor: pointer; width: 28px; height: 26px; border-radius: 5px; border: 1px solid rgba(120,180,150,0.2); color: #9db8a8; font-size: 11px; text-align: center; line-height: 26px; }
    .chip.on { background: rgba(126,224,168,0.15); color: #7ee0a8; border-color: rgba(126,224,168,0.5); }
    #val { width: 100%; accent-color: #7ee0a8; }
    .row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #9db8a8; }
    .row input[type=range] { flex: 1; accent-color: #7ee0a8; }
    .val { color: #f0c46a; min-width: 42px; text-align: right; }
    #part { font-size: 12px; color: #9db8a8; }
    #part b { color: #7ee0a8; }
    footer { font-size: 11px; color: #5f7268; }
    footer a { color: #7ee0a8; text-decoration: none; }
    @media (max-width: 720px) { body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } #panel { border-left: none; border-top: 1px solid rgba(120,180,150,0.15); } }
  </style>
</head>
<body>
  <div id="main">
    <h1><span>電</span> CIRCUIT</h1>
    <span id="stat">—</span>
    <canvas id="board"></canvas>
    <div id="keys"></div>
    <footer>Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>. © 2026 Niumination.</footer>
  </div>
  <div id="panel">
    <h2>PART (klik slot di papan)</h2>
    <div id="kinds" class="chips"></div>
    <label class="row">nilai <input id="val" type="range" /></label>
    <span id="val-v" class="val"></span>
    <span id="part">—</span>
    <h2>EFFECTS</h2>
    <label class="row">crush <input id="crush" type="range" min="1" max="8" step="0.5" value="8" /></label>
    <span id="crush-v" class="val"></span>
    <label class="row">echo <input id="echo" type="range" min="0" max="0.8" step="0.02" value="0.3" /></label>
    <span id="echo-v" class="val"></span>
    <label class="row">space <input id="space" type="range" min="0" max="0.9" step="0.02" value="0.3" /></label>
    <span id="space-v" class="val"></span>
    <h2>LFO</h2>
    <label class="row">tune <input id="lfo-tune" type="range" min="0" max="1" step="0.02" value="0.2" /></label>
    <span id="lfo-tune-v" class="val"></span>
    <label class="row">power <input id="lfo-power" type="range" min="0" max="1" step="0.02" value="0.1" /></label>
    <span id="lfo-power-v" class="val"></span>
    <label class="row">damp <input id="lfo-damp" type="range" min="0" max="1" step="0.02" value="0.1" /></label>
    <span id="lfo-damp-v" class="val"></span>
    <label class="row">level <input id="lfo-level" type="range" min="0" max="1" step="0.02" value="0.2" /></label>
    <span id="lfo-level-v" class="val"></span>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

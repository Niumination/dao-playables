<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDORA 樸 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: #08090b; color: #d6d0d8; overflow: hidden; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 14px; left: 16px; font-size: 12px; color: #9a92a0; line-height: 1.7; pointer-events: none; }
    #hud b { color: #efeaf2; letter-spacing: 0.05em; }
    #hud .zh { color: #b08fc9; }
    #panel { position: fixed; top: 14px; right: 16px; width: 230px; background: rgba(12, 11, 14, 0.76); border: 1px solid rgba(176, 143, 201, 0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(6px); }
    #panel h2 { font-size: 11px; color: #b08fc9; letter-spacing: 0.12em; margin-bottom: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: #b3a9bd; }
    #panel input[type=range] { width: 100%; accent-color: #b08fc9; }
    #panel .val { color: #efeaf2; }
    #panel button { all: unset; cursor: pointer; margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(176, 143, 201, 0.4); color: #b08fc9; font-size: 11px; text-align: center; display: block; }
    #panel button:hover { background: rgba(176, 143, 201, 0.12); }
    footer { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5e5763; pointer-events: none; }
    footer a { color: #b08fc9; text-decoration: none; }
    @media (max-width: 640px) { #panel { width: 180px; font-size: 11px; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>PANDORA</b> <span class="zh">樸</span><br /><span id="stat">—</span></div>
  <div id="panel">
    <h2>PARAMETER</h2>
    <label>kepadatan butir <span class="val" id="d-v">0.9</span></label>
    <input id="dens" type="range" min="0.2" max="2" step="0.05" value="0.9" />
    <label>rotasi <span class="val" id="r-v">0.25</span></label>
    <input id="rot" type="range" min="0" max="1.2" step="0.01" value="0.25" />
    <label>skala <span class="val" id="s-v">1.0</span></label>
    <input id="scale" type="range" min="0.3" max="2.5" step="0.05" value="1.0" />
    <button id="regen">↻ bentuk baru</button>
  </div>
  <footer>
    Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>.
    Bukan salinan: kode & desain ditulis dari nol. © 2026 Niumination.
  </footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

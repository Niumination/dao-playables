<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PANDORA 樸 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: #0a0908; color: #d8d0c8; overflow: hidden; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 14px; left: 16px; font-size: 12px; color: #a09888; line-height: 1.7; pointer-events: none; }
    #hud b { color: #f2ece2; letter-spacing: 0.05em; }
    #hud .zh { color: #c9a27a; }
    #panel { position: fixed; top: 14px; right: 16px; width: 236px; background: rgba(14,12,10,0.78); border: 1px solid rgba(201,162,122,0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(6px); }
    #panel h2 { font-size: 11px; color: #c9a27a; letter-spacing: 0.12em; margin-bottom: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: #b6a898; }
    #panel input[type=range] { width: 100%; accent-color: #c9a27a; }
    #panel select { width: 100%; background: #14100c; color: #d8d0c8; border: 1px solid rgba(201,162,122,0.35); border-radius: 5px; padding: 3px; font-family: inherit; font-size: 11px; }
    #panel .val { color: #f2ece2; }
    #panel #msg { display: block; font-size: 11px; color: #c0a890; margin-top: 8px; min-height: 2em; }
    #map { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    #map .face { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 5px; font-size: 10px; text-align: center; line-height: 26px; color: #fff; opacity: 0.85; }
    #map .face:hover { opacity: 1; outline: 1px solid #f0c46a; }
    footer { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #6b6055; pointer-events: none; }
    footer a { color: #c9a27a; text-decoration: none; }
    @media (max-width: 640px) { #panel { width: 190px; font-size: 11px; } }
  </style>
  <script type="module" crossorigin src="/pandora/assets/index-gAahVoFk.js"></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>PANDORA</b> <span class="zh">樸</span><br /><span id="stat">—</span><br /><span class="hint">klik muka di peta → putar · drag kubus = orbit</span></div>
  <div id="panel">
    <h2>KUBUS 6 SISI</h2>
    <div id="map"></div>
    <span id="moves" class="val">0</span> <span class="val">langkah</span>
    <span id="msg">klik muka di peta untuk memutar</span>
    <label>studio light <span class="val" id="light-v">0.60</span></label>
    <input id="light" type="range" min="0" max="1" step="0.02" value="0.6" />
    <label>tracks <select id="track">
      <option value="kosong">tanpa audio</option>
      <option value="track 1" selected>track 1</option>
      <option value="track 2">track 2</option>
      <option value="track 3">track 3</option>
    </select></label>
    <button id="play">▶ play</button>
    <button id="scramble">⟳ acak 24</button>
    <button id="undo">↩ undo</button>
    <button id="solve">✓ solve</button>
  </div>
  <footer>
    Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>.
    Bukan salinan: kode & desain ditulis dari nol. © 2026 Niumination.
  </footer>
</body>
</html>

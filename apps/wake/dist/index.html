<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WAKE 森 — dao-playables (rekonstruksi mandiri)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body { background: #060807; color: #cfe0d8; overflow: hidden; font-family: 'SF Mono', ui-monospace, Menlo, monospace; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #hud { position: fixed; top: 14px; left: 16px; font-size: 12px; color: #8fa89c; line-height: 1.7; pointer-events: none; }
    #hud b { color: #e8f2ec; letter-spacing: 0.05em; }
    #hud .zh { color: #7fc9a8; }
    #panel { position: fixed; top: 14px; right: 16px; width: 230px; background: rgba(9, 12, 10, 0.78); border: 1px solid rgba(127, 201, 168, 0.3); border-radius: 10px; padding: 12px 14px; font-size: 12px; backdrop-filter: blur(6px); }
    #panel h2 { font-size: 11px; color: #7fc9a8; letter-spacing: 0.12em; margin-bottom: 8px; }
    #panel label { display: block; margin: 8px 0 2px; color: #a8bdb1; }
    #panel input[type=range] { width: 100%; accent-color: #7fc9a8; }
    #panel .val { color: #e8f2ec; }
    #panel button { all: unset; cursor: pointer; margin-top: 10px; padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(127, 201, 168, 0.4); color: #7fc9a8; font-size: 11px; text-align: center; display: block; }
    #panel button:hover { background: rgba(127, 201, 168, 0.12); }
    #step { position: fixed; bottom: 40px; left: 0; right: 0; display: flex; justify-content: center; gap: 5px; }
    .step { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgba(127,201,168,0.35); color: #7fc9a8; font-size: 11px; text-align: center; line-height: 30px; background: rgba(9,12,10,0.6); }
    .step.on { background: rgba(127,201,168,0.2); }
    .step.cur { border-color: #f0c46a; color: #f0c46a; }
    footer { position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 11px; color: #5b6e63; pointer-events: none; }
    footer a { color: #7fc9a8; text-decoration: none; }
    @media (max-width: 640px) { #panel { width: 180px; font-size: 11px; } }
  </style>
  <script type="module" crossorigin src="/wake/assets/index-Bcz3mTKx.js"></script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>WAKE</b> <span class="zh">森</span><br /><span id="stat">—</span></div>
  <div id="step"></div>
  <div id="panel">
    <h2>PARAMETER</h2>
    <label>bloom <span class="val" id="b-v">1.4</span></label>
    <input id="bloom" type="range" min="0" max="3" step="0.05" value="1.4" />
    <label>kepadatan pohon <span class="val" id="t-v">0.8</span></label>
    <input id="trees" type="range" min="0.2" max="1.6" step="0.05" value="0.8" />
    <label>angin <span class="val" id="w-v">0.5</span></label>
    <input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.5" />
    <label>studio light <span class="val" id="light-v">0.60</span></label>
    <input id="light" type="range" min="0" max="1" step="0.02" value="0.6" />
    <label>sequencer <span class="val" id="bpm-v">92</span> bpm</label>
    <input id="bpm" type="range" min="60" max="160" step="1" value="92" />
    <button id="play">▶ mainkan sequencer</button>
  </div>
  <footer>
    Implementasi ulang mandiri — terinspirasi karya <a href="https://be-of-dao.com" rel="noopener">be-of-dao / DAO</a>.
    Bukan salinan: kode & desain ditulis dari nol. © 2026 Niumination.
  </footer>
</body>
</html>
